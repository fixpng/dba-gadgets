# Prometheus 配置文件
# 全局配置
global:
  scrape_interval: 15s      # 抓取间隔
  evaluation_interval: 15s   # 规则评估间隔
  external_labels:
    cluster: 'monitoring'
    replica: 'prometheus-1'

# 告警规则文件
rule_files:
  - "rules/*.yml"

# 抓取配置
scrape_configs:
  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'prometheus'

  # Node Exporter - 系统指标监控（需要单独部署 node_exporter）
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
  #       labels:
  #         instance: 'node-exporter'

  # MySQL Exporter - MySQL 监控（需要单独部署 mysql_exporter）
  # - job_name: 'mysql-exporter'
  #   static_configs:
  #     - targets: ['mysql-exporter:9104']
  #       labels:
  #         instance: 'mysql-exporter'

  # Docker 容器监控（需要 cAdvisor）
  # - job_name: 'cadvisor'
  #   static_configs:
  #     - targets: ['cadvisor:8080']
  #       labels:
  #         instance: 'cadvisor'

  # 示例：监控其他服务
  # - job_name: 'custom-service'
  #   static_configs:
  #     - targets: ['service:port']
  #       labels:
  #         instance: 'custom-service'


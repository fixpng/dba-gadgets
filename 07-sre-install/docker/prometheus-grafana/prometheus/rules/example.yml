# 示例告警规则文件
groups:
  - name: example
    interval: 30s
    rules:
      # 示例：Prometheus 目标下线告警
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target is down"
          description: "Target {{ $labels.instance }} has been down for more than 1 minute."

